name: cloudflare-os-apps

services:
  cloudflare-os:
    build:
      context: ../..
      dockerfile: deploy/auto-macmini/Dockerfile
    image: cloudflare-os-apps:latest
    container_name: cloudflare-os-apps
    restart: unless-stopped
    init: true
    env_file:
      - path: "${CLOUDFLARE_OS_OAUTH_ENV_FILE:-/dev/null}"
        required: false
    environment:
      CLOUDFLARE_OS_DISABLE_WATCHERS: "true"
      CLOUDFLARE_OS_ADMINS: "${CLOUDFLARE_OS_ADMINS:?set in the protected runtime env file}"
      PUBLIC_BASE_URL: "https://cloudflare-os.cddao.com"
      HOME: /home/node
    ports:
      - "10.168.10.101:8787:8787"
    volumes:
      - cloudflare_os_apps_data:/app/.wrangler
    mem_limit: 6g
    cpus: 4.0
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8787/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s

volumes:
  cloudflare_os_apps_data:
    name: cloudflare-os-apps-data
